aid: ambiq-micro
name: Ambiq Micro
description: >-
  Ambiq Micro is a semiconductor company that designs ultra-low-power System-on-Chip (SoC)
  solutions for battery-powered and endpoint-AI devices. Its proprietary Subthreshold
  Power Optimized Technology (SPOT) platform lets its Apollo family of Arm Cortex-M
  microcontrollers and Artasie real-time clocks run at extremely low energy, powering
  wearables, hearables, healthcare, smart-home, industrial and gaming devices. Ambiq's
  developer surface is an embedded C/C++ toolchain - the AmbiqSuite SDK and the open-source
  neuralSPOT AI SDK/Toolkit - plus a set of first-party Python AI toolkits (heartKIT,
  sleepKIT, physioKIT, neuralspotx) published on PyPI and GitHub (AmbiqAI, AmbiqMicro).
  This is not a web/REST API provider; it is profiled here for its open-source developer
  and AI SDK footprint.
